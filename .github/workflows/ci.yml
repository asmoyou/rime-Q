name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test_client_parity.py

  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Install SQLite on Windows
        if: runner.os == 'Windows'
        run: vcpkg install sqlite3:x64-windows
      - name: Configure Unix
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -A x64
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Compile the Mac client
        if: runner.os == 'macOS'
        run: swift build -c release

  windows-package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Cache verified Windows dependency archives
        uses: actions/cache@v4
        with:
          path: .cache
          key: windows-resources-${{ hashFiles('dependencies.lock.json') }}
      - name: Build client and run isolated engine, TSF and UI regressions
        run: python scripts/build_windows.py --smoke
      - name: Install, repair, reject downgrade and retain personal data on uninstall
        run: ./scripts/test_windows_install.ps1
      - name: Collect Windows installation log
        if: always()
        shell: pwsh
        run: |
          $source = 'C:\Program Files\RimeQ\installation.log'
          if (Test-Path -LiteralPath $source) {
            New-Item -ItemType Directory -Force artifacts | Out-Null
            Copy-Item -LiteralPath $source -Destination artifacts/windows-installation.log
          }
      - uses: actions/upload-artifact@v4
        with:
          name: RimeQ-Windows-x64
          path: |
            dist/*-windows-*.exe
            dist/*-windows-SHA256SUMS.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RimeQ-Windows-validation
          path: |
            artifacts/windows-ui/*.png
            artifacts/windows-installation.log
          retention-days: 7

  mac-package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache verified build downloads
        uses: actions/cache@v4
        with:
          path: .cache
          key: mac-resources-${{ hashFiles('dependencies.lock.json') }}
      - run: python3 scripts/build_macos.py --universal --smoke
      - name: Install the actual PKG at its fixed system path
        run: sudo installer -pkg dist/RimeQ-*-macos-universal.pkg -target /
      - name: Verify activation result or explicit pending fallback
        run: |
          rimeq_status="$HOME/Library/Application Support/RimeQ/installation-status.plist"
          for attempt in {1..45}; do
            if test -f "$rimeq_status"; then
              if test "$(plutil -extract state raw -o - "$rimeq_status")" != pending \
                  || test "$(plutil -extract retryScheduled raw -o - "$rimeq_status")" = true; then
                break
              fi
            fi
            sleep 1
          done
          rimeq_state="$(plutil -extract state raw -o - "$rimeq_status")"
          cat "$HOME/Library/Application Support/RimeQ/installation.log"
          case "$rimeq_state" in
            ready)
              '/Library/Input Methods/RimeQ.app/Contents/MacOS/RimeQ' --rimeq-tis-verify-mode
              '/Library/Input Methods/RimeQ.app/Contents/MacOS/RimeQ' --verify-runtime
              ;;
            pending)
              test "$(plutil -extract retryScheduled raw -o - "$rimeq_status")" = true
              test -f "$HOME/Library/LaunchAgents/com.asmoyou.rimeq.activation.plist"
              echo '::notice::GUI activation is pending on this runner; verified the explicit login-retry fallback.'
              ;;
            *) exit 1 ;;
          esac
      - name: Verify the installed application and bundled engine
        run: |
          codesign --verify --deep --strict '/Library/Input Methods/RimeQ.app'
          plutil -extract NSAppleEventsUsageDescription raw -o - '/Library/Input Methods/RimeQ.app/Contents/Info.plist'
          '/Library/Input Methods/RimeQ.app/Contents/MacOS/RimeQ' --smoke
          '/Library/Input Methods/RimeQ.app/Contents/MacOS/RimeQ' --installation-smoke
          '/Library/Input Methods/RimeQ.app/Contents/MacOS/RimeQ' --maintenance-smoke
          '/Library/Input Methods/RimeQ.app/Contents/MacOS/RimeQ' --update-smoke
          '/Library/Input Methods/RimeQ.app/Contents/MacOS/RimeQ' --candidate-smoke
          '/Library/Input Methods/RimeQ.app/Contents/MacOS/RimeQ' --version
          test ! -e dist/RimeQ.app
      - name: Verify same-version repair replaces the application
        # The disposable runner is also used to exercise repair and downgrade rejection.
        # These mutations must not be run against a user's live installation.
        run: |
          rimeq_app='/Library/Input Methods/RimeQ.app'
          rimeq_status="$HOME/Library/Application Support/RimeQ/installation-status.plist"
          rimeq_data="$HOME/Library/Application Support/RimeQ/rime"
          rimeq_model="$HOME/Library/Application Support/RimeQ/models/wanxiang-lts-zh-hans.gram"
          mkdir -p "$rimeq_data"
          mkdir -p "$(dirname "$rimeq_model")"
          # A small sentinel tests installer file retention; model validation
          # and reuse across app versions run separately in test_optional_model.py.
          printf 'model retention fixture\n' > "$rimeq_model"
          rimeq_model_hash="$(shasum -a 256 "$rimeq_model")"
          touch "$rimeq_data/repair-retention-check"
          rm -f "$rimeq_status"
          sudo touch "$rimeq_app/Contents/Resources/rimeq-repair-probe"
          sudo installer -pkg dist/RimeQ-*-macos-universal.pkg -target /
          test ! -e "$rimeq_app/Contents/Resources/rimeq-repair-probe"
          test -f "$rimeq_data/repair-retention-check"
          test "$(shasum -a 256 "$rimeq_model")" = "$rimeq_model_hash"
          codesign --verify --deep --strict "$rimeq_app"
          for attempt in {1..45}; do
            if test -f "$rimeq_status"; then
              if test "$(plutil -extract state raw -o - "$rimeq_status")" != pending \
                  || test "$(plutil -extract retryScheduled raw -o - "$rimeq_status")" = true; then
                break
              fi
            fi
            sleep 1
          done
          tail -100 "$HOME/Library/Application Support/RimeQ/installation.log"
          test -f "$rimeq_status"
          rimeq_state="$(plutil -extract state raw -o - "$rimeq_status")"
          case "$rimeq_state" in
            ready) ;;
            pending)
              test "$(plutil -extract retryScheduled raw -o - "$rimeq_status")" = true
              test -f "$HOME/Library/LaunchAgents/com.asmoyou.rimeq.activation.plist"
              echo '::notice::Repair retained the explicit pending activation/login-retry fallback.'
              ;;
            *) exit 1 ;;
          esac
          if test "$(plutil -extract state raw -o - "$rimeq_status")" = ready; then
            "$rimeq_app/Contents/MacOS/RimeQ" --verify-runtime
          fi
      - name: Reject a package older than the installed release
        run: |
          rimeq_info='/Library/Input Methods/RimeQ.app/Contents/Info.plist'
          rimeq_info_backup="$(mktemp)"
          cp "$rimeq_info" "$rimeq_info_backup"
          restore_rimeq_info() {
            sudo cp "$rimeq_info_backup" "$rimeq_info"
            rm -f "$rimeq_info_backup"
          }
          trap restore_rimeq_info EXIT
          sudo /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 9.9.9' "$rimeq_info"
          if sudo installer -pkg dist/RimeQ-*-macos-universal.pkg -target /; then
            echo '::error::An older package was accepted over a newer installed release.'
            exit 1
          fi
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$rimeq_info")" = 9.9.9
      - name: Verify uninstall retains personal data
        run: |
          rimeq_data="$HOME/Library/Application Support/RimeQ/rime"
          rimeq_model="$HOME/Library/Application Support/RimeQ/models/wanxiang-lts-zh-hans.gram"
          rimeq_model_hash="$(shasum -a 256 "$rimeq_model")"
          mkdir -p "$rimeq_data"
          touch "$rimeq_data/uninstall-retention-check"
          sudo bash '/Library/Input Methods/RimeQ.app/Contents/Resources/uninstall-system.sh'
          test ! -e '/Library/Input Methods/RimeQ.app'
          test -f "$rimeq_data/uninstall-retention-check"
          test "$(shasum -a 256 "$rimeq_model")" = "$rimeq_model_hash"
      - uses: actions/upload-artifact@v4
        with:
          name: RimeQ-macOS
          path: dist/*.pkg
          retention-days: 7

# Based on rime-ice; the complete pinned upstream source accompanies the application.
__include: rime_ice.schema:/

schema:
  schema_id: rime_q
  name: Rime Q
  version: "0.1.0"
  author: [Rime Q contributors, Dvel]
  description: 简体全拼，离线输入。
  dependencies: [melt_eng, radical_pinyin]

# Keep the input-related capabilities. The host provides its own presentation.
engine:
  translators:
    - punct_translator
    - script_translator
    - table_translator@custom_phrase
    - table_translator@melt_eng
    - table_translator@cn_en
    - table_translator@radical_lookup
  filters:
    - lua_filter@*corrector
    - reverse_lookup_filter@radical_reverse_lookup
    - lua_filter@*autocap_filter
    - lua_filter@*v_filter
    - lua_filter@*reduce_english_filter
    - simplifier@emoji
    - simplifier@traditionalize
    - lua_filter@*search@radical_pinyin
    - uniquifier

# Share personal learning with the sentence-optimization schema.
translator:
  dictionary: rime_ice
  user_dict: rime_q
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true

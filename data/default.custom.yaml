# Rime Q application policy. User-specific patches remain in the private user directory.
patch:
  schema_list:
    - schema: rime_q
    - schema: rime_q_grammar
  menu/page_size: 5
  switcher/hotkeys: []
  # The app selects grammar only after the optional model has been verified.
  switcher/fix_schema_list_order: true

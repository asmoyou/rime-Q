# Grammar parameters follow rime-ice/others/recipes/grammar.recipe.yaml.
__include: rime_q.schema:/

schema:
  schema_id: rime_q_grammar
  name: Rime Q · 长句优化
  version: "0.2.4"
  author: [Rime Q contributors, Dvel, amzxyz]
  description: 雾凇词库与万象语法模型，离线输入。
  dependencies: [melt_eng, radical_pinyin]

grammar:
  language: wanxiang-lts-zh-hans
  collocation_max_length: 6
  collocation_min_length: 3
  collocation_penalty: -14
  non_collocation_penalty: -6
  weak_collocation_penalty: -100
  rear_penalty: -20

translator:
  contextual_suggestions: false
  max_homophones: 8
